name: Build and publish brand system
on:
  push:
    branches: [main, feat/brand-system]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve exact icon packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile
        if: github.ref == 'refs/heads/feat/brand-system'
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: update exact icon dependency lockfile"
            git push origin HEAD:feat/brand-system
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run test:design-system
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
