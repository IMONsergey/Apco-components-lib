<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#f6f6f6"/>
  <script>
    try {
      const saved = localStorage.getItem('apcosys-components-theme');
      const theme = saved === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0d1113' : '#f6f6f6';
    } catch {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <meta name="description" content="APCOSYS design system: components, brand tokens and icon library"/>
  <title>APCOSYS — Design system</title>
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/brand/favicon.svg"/>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
